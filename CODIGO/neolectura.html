<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NeoLectura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1B7DCB; --bg:#DCEEF4; --card:#FFFFFF; --ink:#0B2A4A; --muted:#4F7391;
  --teal:#35BFC0; --orange:#F26B1D; --gold:#FFC81E;
  --line:#E6DAC6; --foot:#EAF5F8; --foot-ink:#7FAAC5;
  --step-bg:#E7F3FC; --step-line:#A9D3F0; --q-bg:#FFF6CC; --q-line:#F2CF3A; --q-ink:#E3A900;
  --lock-bg:#F0F8FB; --lock-ink:#8DB0C7; --lock-box:#DCE5EB;
  --shadow:0 4px 14px rgba(20,90,140,.12);
  --ok:#1E9A64; --bad:#D64545; --chip:#E7F3FC; --field:#F3FAFD;
  --fs:1.0625rem; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --blue:#1A6FB5; --bg:#0C1B29; --card:#132A3D; --ink:#E6F2FA; --muted:#93B3CA; --teal:#3ED0D0;
    --line:#3A4A55; --foot:#0F2334; --foot-ink:#6F95AF; --step-bg:#173650; --step-line:#2F6A9A;
    --q-bg:#3A3210; --q-line:#9C8420; --q-ink:#FFC81E; --lock-bg:#102232; --lock-ink:#5F84A0; --lock-box:#1D3548;
    --shadow:0 4px 14px rgba(0,0,0,.35); --ok:#3BC68B; --bad:#F06B6B; --chip:#173650; --field:#0F2334; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --blue:#1A6FB5; --bg:#0C1B29; --card:#132A3D; --ink:#E6F2FA; --muted:#93B3CA; --teal:#3ED0D0;
  --line:#3A4A55; --foot:#0F2334; --foot-ink:#6F95AF; --step-bg:#173650; --step-line:#2F6A9A;
  --q-bg:#3A3210; --q-line:#9C8420; --q-ink:#FFC81E; --lock-bg:#102232; --lock-ink:#5F84A0; --lock-box:#1D3548;
  --shadow:0 4px 14px rgba(0,0,0,.35); --ok:#3BC68B; --bad:#F06B6B; --chip:#173650; --field:#0F2334; color-scheme:dark;
}

*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.35}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
svg{display:block}
.ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Encabezados ---------- */
.hdr{background:var(--blue);color:#fff;padding:0 20px;position:sticky;top:0;z-index:5}
.hdr.home{height:76px;display:flex;align-items:center;justify-content:space-between}
.hdr h1{font-size:24px;font-weight:800;line-height:1.1}
.hdr .sub{font-size:12px;font-weight:700;opacity:.9;margin-top:3px}
.hdr .acts{display:flex;gap:12px}
.rbtn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;color:#fff;transition:background .15s}
.rbtn:hover{background:rgba(255,255,255,.34)}
.hdr.bar{height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.back{justify-self:start;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.2);font-weight:800;font-size:14px;color:#fff}
.back:hover{background:rgba(255,255,255,.34)}
.hdr.bar h2{font-size:17px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}

/* ---------- Estructura ---------- */
main{max-width:1400px;margin:0 auto;padding:17px 16px 32px}
.doc{max-width:820px;margin:0 auto}
.mcard{background:var(--card);border-radius:30px;box-shadow:var(--shadow);padding:0 24px;min-height:104px;display:flex;align-items:center;gap:20px}
.mcard .mt{font-size:17px;font-weight:800;color:var(--blue)}
.mcard .ms{font-size:14px;font-weight:600;color:var(--muted);margin-top:2px}
.mcard .ms b{color:var(--teal);font-weight:800}
.mcard .cnt{font-size:13px;font-weight:800;color:var(--teal);margin-top:4px}
.stars{display:flex;gap:2px;margin-top:4px}
.stars span{color:var(--step-line)}
.stars span.on{color:var(--gold)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 14px}
.sec h3{font-size:20px;font-weight:800}
.sec span{font-size:13px;font-weight:700;color:var(--muted)}

/* ---------- Cuentos ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.story{position:relative;border-radius:26px;overflow:hidden;background:var(--card);border:3px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;text-align:left;width:100%}
.story.open{border-color:var(--orange);cursor:pointer;transition:transform .15s}
.story.open:hover{transform:translateY(-3px)}
.cover{position:relative;aspect-ratio:3/4;overflow:hidden;background:#345}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;right:10px;background:var(--teal);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px}
.veil{position:absolute;inset:0;background:rgba(85,112,126,.74);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-size:11px;font-weight:800}
.cap{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 14px;text-align:center;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.cap b{display:block;font-size:clamp(14px,1.45vw,18px);font-weight:800}
.cap i{font-style:normal;font-size:12px;font-weight:700;opacity:.88}
.foot{height:26px;display:grid;place-items:center;background:var(--foot);color:var(--foot-ink);font-size:11px;font-weight:800}
.story.open .foot{color:var(--teal)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.link{background:var(--card);border-radius:20px;box-shadow:var(--shadow);height:54px;display:flex;align-items:center;gap:14px;padding:0 20px;font-weight:800;font-size:16px;text-align:left}
.link:hover{transform:translateY(-2px)}
.link{transition:transform .15s}

/* ---------- Niveles ---------- */
.lvl{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:16px 16px 14px;margin-top:18px;cursor:pointer}
.lvl-top{display:flex;align-items:center;gap:16px}
.num{width:56px;height:56px;border-radius:14px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
.lvl-top .t{flex:1;min-width:0}
.lvl-top h4{font-size:18px;font-weight:800}
.lvl-top p{font-size:13px;color:var(--muted);font-weight:600}
.lvl-top .go{color:var(--blue)}
.lvl.locked{background:var(--lock-bg);box-shadow:none;cursor:default}
.lvl.locked .num{background:var(--lock-box);color:var(--lock-ink)}
.lvl.locked h4,.lvl.locked p{color:var(--lock-ink)}
.steps{display:flex;align-items:flex-start;margin-top:14px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0}
.step.q{flex:none;width:64px}
.circ{width:40px;height:40px;border-radius:50%;border:2px solid var(--step-line);background:var(--step-bg);color:var(--blue);font-weight:800;font-size:14px;display:grid;place-items:center;transition:transform .15s}
.step:hover .circ{transform:scale(1.08)}
.circ.done{background:var(--blue);border-color:var(--blue);color:#fff}
.circ.quiz{border-color:var(--q-line);background:var(--q-bg);color:var(--q-ink)}
.circ.quiz.done{background:var(--gold);border-color:var(--gold);color:#5a3d00}
.lab{font-size:10px;font-weight:700;color:var(--muted);max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{height:40px;display:grid;place-items:center;padding:0 6px;color:var(--muted)}

/* ---------- Lectura ---------- */
.paper{background:var(--card);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;margin-top:18px}
.banner{height:170px;position:relative;background:#345}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.paper .in{padding:22px 24px 26px}
.paper .in.center{text-align:center}
.meta{font-size:13px;font-weight:800;color:var(--teal)}
.paper h2{font-size:24px;font-weight:800;margin:4px 0 12px}
.txt{font-size:var(--fs);line-height:1.75;font-weight:600;max-width:68ch}
.vocab{border-bottom:2.5px dotted var(--teal);color:inherit;font:inherit;padding:0 1px;background:none}
.vocab:hover{background:var(--chip)}
.hint{font-size:13px;color:var(--muted);font-weight:600;margin-top:14px}
.defbox{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--chip);font-size:15px;font-weight:600}
.defbox[hidden]{display:none}
.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--step-line)}
.dots i.on{background:var(--blue)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:999px;font-weight:800;font-size:15px;transition:filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn.pri{background:var(--blue);color:#fff}
.btn.ghost{background:var(--chip);color:var(--blue)}
.btn.gold{background:var(--gold);color:#5a3d00}
.btn.danger{background:#FDECEC;color:#C43A3A}

/* ---------- Quiz ---------- */
.pbar{height:8px;border-radius:99px;background:var(--step-bg);margin:10px 0 18px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--teal);transition:width .3s}
.qq{font-size:20px;font-weight:800}
.opt{width:100%;text-align:left;padding:13px 16px;border-radius:16px;border:2px solid var(--step-line);background:var(--card);color:var(--ink);font-weight:700;font-size:16px;margin-top:10px;display:flex;gap:12px;align-items:center;transition:border-color .15s,background .15s}
.opt:not(:disabled):hover{border-color:var(--blue);background:var(--chip)}
.opt:disabled{cursor:default}
.opt .k{width:28px;height:28px;border-radius:50%;background:var(--step-bg);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--blue);flex:none}
.opt.ok{border-color:var(--ok);background:rgba(30,154,100,.13)}
.opt.bad{border-color:var(--bad);background:rgba(214,69,69,.12)}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:700;font-size:15px}
.fb.ok{background:rgba(30,154,100,.14);color:var(--ok)}
.fb.bad{background:rgba(214,69,69,.12);color:var(--bad)}
.bigstars{display:flex;justify-content:center;gap:8px;margin-bottom:8px}
.bigstars span{color:var(--step-line)}
.bigstars span.on{color:var(--gold);animation:pop .5s ease both}
.bigstars span.on:nth-child(2){animation-delay:.12s}
.bigstars span.on:nth-child(3){animation-delay:.24s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.res-txt{font-size:16px;font-weight:600;color:var(--muted);margin:0 auto 18px;max-width:46ch}
.res-btns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

/* ---------- Ranking / opciones / créditos ---------- */
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);margin-top:10px;border:2px solid transparent}
.row.me{border-color:var(--teal)}
.pos{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--chip);color:var(--blue);flex:none}
.pos.g1{background:#FFD54A;color:#6b4a00}
.pos.g2{background:#D5DDE4;color:#3d4a55}
.pos.g3{background:#E5B584;color:#5b3416}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.row .nm{font-weight:800;font-size:16px}
.row .nm small{font-weight:700;color:var(--teal);font-size:12px;margin-left:6px}
.row .pts{margin-left:auto;font-weight:800;color:var(--teal)}
.set{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px 20px;margin-top:14px}
.set h4{font-size:16px;font-weight:800}
.set p{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.set.two{display:flex;align-items:center;justify-content:space-between;gap:16px}
.inp{width:100%;height:46px;border-radius:14px;border:2px solid var(--step-line);background:var(--field);padding:0 14px;font-weight:700;color:var(--ink);margin-top:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{padding:8px 16px;border-radius:999px;background:var(--chip);color:var(--blue);font-weight:800;font-size:14px}
.chip.on{background:var(--blue);color:#fff}
.set .prev{margin-top:12px;color:var(--ink);font-weight:600;line-height:1.5}
.sw{width:52px;height:30px;border-radius:99px;background:var(--step-line);position:relative;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--teal)}
.sw.on::after{left:25px}
.credit p{font-size:15px;font-weight:600;color:var(--ink);line-height:1.6;margin-top:6px}
.credit h4{display:flex;align-items:center;gap:10px}

/* ---------- Ingreso, avisos y diálogos ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lcard{background:var(--card);border-radius:30px;box-shadow:var(--shadow);padding:28px 26px;width:100%;max-width:400px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.lcard h1{font-size:28px;font-weight:900;color:var(--blue)}
.lcard p{font-size:15px;font-weight:600;color:var(--muted)}
.lcard .inp{text-align:center;margin-bottom:10px}
.modal{position:fixed;inset:0;background:rgba(6,25,45,.5);display:grid;place-items:center;z-index:20;padding:20px}
.mbox{background:var(--card);border-radius:24px;padding:24px;max-width:360px;width:100%;text-align:center}
.mbox p{font-weight:700;font-size:16px;margin-bottom:18px}
.mrow{display:flex;gap:10px;justify-content:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#0B2A4A;color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .story{border-radius:22px}
  .mcard{padding:0 18px;gap:14px}
  .paper .in{padding:18px 18px 22px}
  .banner{height:130px}
}
@media (max-width:420px){
  .links{gap:10px}
  .link{padding:0 14px;font-size:15px;gap:10px}
  .hdr h1{font-size:21px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';

/* Mascota: el libro con anteojos */

const totalDone=()=>STORIES.filter(s=>s.open).reduce((a,s)=>a+doneCount(s.id),0);
const unlocked=(sid,l)=>l===0||!!S.done[kd(sid,l-1)];
const partsRead=(sid,l)=>{let n=0;for(let p=0;p<PARTS;p++)if(S.parts[kp(sid,l,p)])n++;return n};
const starCount=()=>S.points>=1200?3:S.points>=600?2:S.points>=200?1:0;
const started=sid=>Object.keys(S.parts).some(k=>k.indexOf(sid+':')===0);
const plain=t=>t.replace(/\{([^|}]+)\|[^}]+\}/g,'$1');
const vocab=t=>t.replace(/\{([^|}]+)\|([^}]+)\}/g,(m,w,d)=>`<button class="vocab" data-a="def" data-w="${ESC(w)}" data-d="${ESC(d)}">${w}</button>`);
const canSpeak=typeof window!=='undefined'&&'speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;

/* =====================  PANTALLAS  ===================== */
const bar=(title,back)=>`<header class="hdr bar"><button class="back" data-a="nav" data-to="${back}">${ic('back',16)} Volver</button><h2>${ESC(title)}</h2><span></span></header>`;

function starsRow(){const n=starCount();return `<div class="stars" aria-label="${n} de 3 estrellas">${[0,1,2].map(i=>`<span class="${i<n?'on':''}">${ic('star',16,true)}</span>`).join('')}</div>`}

function storyCard(s){
  const img=cover(s);
  if(s.open){
    const n=doneCount(s.id),st=started(s.id);
    return `<article class="story open" data-a="nav" data-to="levels:${s.id}" role="button" tabindex="0" aria-label="Abrir ${ESC(s.title)}">
      <div class="cover"><img src="${img}" alt="">${st?'':'<span class="badge">¡Nuevo!</span>'}
      <div class="cap"><b>${ESC(s.title)}</b><i>${ESC(s.genre)}</i></div></div>
      <div class="foot">${st?`Continuar · ${n}/${s.levels.length} niveles`:'¡A leer!'}</div></article>`;
  }
  return `<article class="story" aria-disabled="true"><div class="cover"><img src="${img}" alt="">
    <div class="veil">${ic('lock',26)}<span>Próximamente</span></div>
    <div class="cap"><b>${ESC(s.title)}</b><i>${ESC(s.genre)}</i></div></div><div class="foot">Bloqueado</div></article>`;
}

function homeScreen(){
  return `<header class="hdr home"><div><h1>NeoLectura</h1><div class="sub">Bienvenido, ${ESC(S.name)} 👋</div></div>
    <div class="acts">
      <button class="rbtn" data-a="nav" data-to="ranking" aria-label="Ranking">${ic('trophy',18)}</button>
      <button class="rbtn" data-a="nav" data-to="settings" aria-label="Opciones">${ic('gear',18)}</button>
      <button class="rbtn" data-a="logout" aria-label="Salir">${ic('logout',18)}</button>
    </div></header>
  <main>
    <section class="mcard">${MASCOT()}<div><div class="mt">¡Elige un cuento!</div><div class="ms">Tienes <b>${fmt(S.points)} puntos</b></div>${starsRow()}</div></section>
    <div class="sec"><h3>Mis Cuentos</h3><span>${totalDone()} niveles completados</span></div>
    <div class="grid">${STORIES.map(storyCard).join('')}</div>
    <div class="links">
      <button class="link" data-a="nav" data-to="ranking"><span style="color:#F2A900">${ic('trophy',24)}</span>Ranking</button>
      <button class="link" data-a="nav" data-to="credits"><span style="color:var(--teal)">${ic('book',24)}</span>Créditos</button>
    </div>
  </main>`;
}

function levelsScreen(sid){
  const s=story(sid),n=s.levels.length;
  const lv=s.levels.map((L,i)=>{
    if(!unlocked(sid,i))return `<div class="lvl locked"><div class="lvl-top"><div class="num">${ic('lock',22)}</div><div class="t"><h4>Nivel ${i+1}: ${ESC(L.name)}</h4><p>Bloqueado</p></div></div></div>`;
    const dn=!!S.done[kd(sid,i)];
    const steps=L.parts.map((p,j)=>{const r=!!S.parts[kp(sid,i,j)];
      return `<div class="step" data-a="nav" data-to="read:${sid}:${i}:${j}" role="button" tabindex="0" title="${ESC(p.t)}"><div class="circ ${r?'done':''}">${r?ic('check',18):j+1}</div><span class="lab">${ESC(p.t)}</span></div>`}).join('');
    return `<div class="lvl" data-a="cont" data-s="${sid}" data-l="${i}" role="button" tabindex="0">
      <div class="lvl-top"><div class="num">${i+1}</div><div class="t"><h4>Nivel ${i+1}: ${ESC(L.name)}</h4><p>${dn?'Completado ✓':'En progreso'}</p></div><span class="go">${ic('chev',22)}</span></div>
      <div class="steps">${steps}<div class="arrow">${ic('right',16)}</div>
      <div class="step q" data-a="nav" data-to="quiz:${sid}:${i}" role="button" tabindex="0"><div class="circ quiz ${dn?'done':''}">${ic('star',20,dn)}</div><span class="lab">Quiz</span></div></div></div>`;
  }).join('');
  return bar(s.title,'home')+`<main><div class="doc" style="max-width:none">
    <section class="mcard" style="min-height:102px;border-radius:24px">${MASCOT()}<div><div class="mt">¡Selecciona un nivel!</div><div class="ms">Cada nivel tiene 3 partes + un quiz.</div><div class="cnt">${doneCount(sid)}/${n} niveles completados</div></div></section>
    ${lv}</div></main>`;
}

function readScreen(r){
  const s=story(r.sid),L=s.levels[r.l],P=L.parts[r.p];
  const last=r.p===PARTS-1,pos=['50% 22%','50% 50%','50% 82%'][r.p%3];
  return bar(s.title,'levels:'+r.sid)+`<main><div class="doc"><article class="paper">
    <div class="banner"><img src="${cover(s)}" alt="" style="object-position:${pos}"></div>
    <div class="in"><div class="meta">Nivel ${r.l+1}: ${ESC(L.name)} · Parte ${r.p+1} de ${PARTS}</div>
    <h2>${ESC(P.t)}</h2>
    <p class="txt">${vocab(P.x)}</p>
    ${P.x.indexOf('{')>-1?'<p class="hint">Toca las palabras subrayadas para ver qué significan.</p>':''}
    <div class="defbox" id="def" hidden></div>
    <div class="tools">${canSpeak&&S.voice?`<button class="btn ghost" data-a="speak">${ic('vol',18)} Escuchar</button>`:'<span></span>'}
      <div class="dots" aria-hidden="true">${[0,1,2].map(i=>`<i class="${i===r.p?'on':''}"></i>`).join('')}</div></div>
    <div class="nav">${r.p>0?`<button class="btn ghost" data-a="nav" data-to="read:${r.sid}:${r.l}:${r.p-1}">${ic('back',16)} Anterior</button>`:'<span></span>'}
      <button class="btn ${last?'gold':'pri'}" data-a="next">${last?'Ir al Quiz '+ic('star',18,true):'Siguiente '+ic('right',16)}</button></div>
    </div></article></div></main>`;
}

function quizScreen(){
  const s=story(Q.sid),L=s.levels[Q.l],n=L.quiz.length;
  const head=bar('Quiz · Nivel '+(Q.l+1),'levels:'+Q.sid);
  if(Q.end){
    const r=Q.res,lastLv=Q.l===s.levels.length-1;
    const msg=[`Acertaste ${Q.score} de ${n}.`];
    if(r.delta)msg.push(`Ganaste +${fmt(r.delta)} puntos.`);
    if(r.bonus)msg.push(`Bono por completar el nivel: +${r.bonus}.`);
    if(!r.pass)msg.push('Repasa las partes del nivel y vuelve a intentarlo.');
    if(r.pass&&lastLv)msg.push('¡Terminaste todo el cuento!');
    const btns=r.pass
      ?(lastLv?`<button class="btn pri" data-a="nav" data-to="home">Volver a mis cuentos</button>`
              :`<button class="btn ghost" data-a="nav" data-to="levels:${Q.sid}">Ver niveles</button><button class="btn pri" data-a="nav" data-to="read:${Q.sid}:${Q.l+1}:0">Siguiente nivel ${ic('right',16)}</button>`)
      :`<button class="btn ghost" data-a="nav" data-to="levels:${Q.sid}">Repasar</button><button class="btn pri" data-a="nav" data-to="quiz:${Q.sid}:${Q.l}">Reintentar</button>`;
    return head+`<main><div class="doc"><div class="paper"><div class="in center" style="padding-top:28px">
      <div class="bigstars">${Array.from({length:n},(_,i)=>`<span class="${i<Q.score?'on':''}">${ic('star',48,true)}</span>`).join('')}</div>
      <h2>${r.pass?'¡Nivel completado!':'¡Casi lo logras!'}</h2><p class="res-txt">${msg.join(' ')}</p><div class="res-btns">${btns}</div></div></div></div></main>`;
  }
  const q=L.quiz[Q.i],pk=Q.pick;
  const opts=q.o.map((t,k)=>{let c='opt';if(pk!=null){if(k===q.a)c+=' ok';else if(k===pk)c+=' bad'}
    return `<button class="${c}" data-a="pick" data-i="${k}" ${pk!=null?'disabled':''}><span class="k">${'ABC'[k]}</span>${ESC(t)}</button>`}).join('');
  const fb=pk==null?'':pk===q.a?'<div class="fb ok" role="status">¡Muy bien! 🎉</div>':`<div class="fb bad" role="status">Casi. La respuesta correcta era: <b>${ESC(q.o[q.a])}</b></div>`;
  return head+`<main><div class="doc"><div class="paper"><div class="in">
    <div class="meta">Pregunta ${Q.i+1} de ${n}</div>
    <div class="pbar"><i style="width:${(Q.i+(pk!=null?1:0))/n*100}%"></i></div>
    <div class="qq">${ESC(q.q)}</div>${opts}${fb}
    ${pk!=null?`<div class="nav"><span></span><button class="btn pri" data-a="qnext">${Q.i+1<n?'Siguiente':'Ver resultado'} ${ic('right',16)}</button></div>`:''}
    </div></div></div></main>`;
}

const AVC=['#F26B1D','#35BFC0','#1B7DCB','#8E63D4','#E0568A','#3BAA6B','#D99A00','#5C7CFA','#E06666'];
function rankScreen(){
  const list=RIVALS.map(([n,p])=>({n,p,me:false})).concat({n:S.name,p:S.points,me:true}).sort((a,b)=>b.p-a.p);
  const pos=list.findIndex(x=>x.me)+1;
  const rows=list.map((x,i)=>`<div class="row ${x.me?'me':''}"><div class="pos ${i<3?'g'+(i+1):''}">${i+1}</div>
    <div class="av" style="background:${AVC[(x.n.charCodeAt(0)+i)%AVC.length]}">${ESC(x.n.charAt(0).toUpperCase())}</div>
    <div class="nm">${ESC(x.n)}${x.me?'<small>Tú</small>':''}</div><div class="pts">${fmt(x.p)} pts</div></div>`).join('');
  return bar('Ranking','home')+`<main><div class="doc">
    <section class="mcard"><span style="color:#F2A900">${ic('trophy',48)}</span><div><div class="mt">¡Buen trabajo, ${ESC(S.name)}!</div><div class="ms">Estás en el puesto <b>${pos}</b> de ${list.length}</div>${starsRow()}</div></section>
    ${rows}</div></main>`;
}

function creditsScreen(){
  return bar('Créditos','home')+`<main><div class="doc">
    <section class="mcard">${MASCOT()}<div><div class="mt">NeoLectura</div><div class="ms">Plantilla de lectura dinámica</div></div></section>
    <section class="set credit"><h4><span style="color:var(--teal)">${ic('book',22)}</span>Cuentos</h4><p>Fábulas clásicas de la tradición de Esopo, adaptadas y ampliadas para lectores en formación.</p></section>
    <section class="set credit"><h4><span style="color:var(--teal)">${ic('star',22)}</span>Ilustraciones</h4><p>Arte vectorial creado para este prototipo. Puedes reemplazarlo por tus propias fotos en la configuración de cada cuento.</p></section>
    <section class="set credit"><h4><span style="color:var(--teal)">${ic('vol',22)}</span>Lectura en voz alta</h4><p>Usa la voz del navegador o del dispositivo, por lo que puede sonar distinto según el equipo.</p></section>
  </div></main>`;
}

function settingsScreen(){
  const themes=[['auto','Automático'],['light','Claro'],['dark','Oscuro']];
  return bar('Opciones','home')+`<main><div class="doc">
    <section class="mcard"><span style="color:var(--blue)">${ic('gear',44)}</span><div><div class="mt">Opciones</div><div class="ms">Ajusta NeoLectura a tu gusto</div></div></section>
    <section class="set"><h4>Tu nombre</h4><p>Aparece en la pantalla principal y en el ranking.</p><input id="setname" class="inp" maxlength="14" value="${ESC(S.name)}" autocomplete="off" aria-label="Tu nombre"></section>
    <section class="set"><h4>Tamaño de letra</h4><p>Cambia el tamaño del texto de los cuentos.</p>
      <div class="chips">${SIZE_NAMES.map((n,i)=>`<button class="chip ${S.size===i?'on':''}" data-a="size" data-i="${i}">${n}</button>`).join('')}</div>
      <p class="prev" style="font-size:var(--fs)">Así se verá el texto del cuento.</p></section>
    <section class="set two"><div><h4>Lectura en voz alta</h4><p>Muestra el botón «Escuchar» en cada parte del cuento.</p></div>
      <button class="sw ${S.voice?'on':''}" data-a="voice" role="switch" aria-checked="${S.voice}" aria-label="Lectura en voz alta"></button></section>
    <section class="set"><h4>Tema</h4><p>El modo Claro es el diseño original.</p>
      <div class="chips">${themes.map(([v,n])=>`<button class="chip ${S.theme===v?'on':''}" data-a="theme" data-v="${v}">${n}</button>`).join('')}</div></section>
    <section class="set"><h4>Progreso</h4><p>Borra tus puntos y niveles para empezar de nuevo.</p><button class="btn danger" data-a="reset" style="margin-top:12px">Reiniciar progreso</button></section>
  </div></main>`;
}

function loginScreen(){
  return `<div class="login"><div class="lcard">${MASCOT(84)}<h1>NeoLectura</h1><p>¡Hola! ¿Cómo te llamas?</p>
    <input id="lname" class="inp" maxlength="14" value="${ESC(S.name)}" autocomplete="off" aria-label="Tu nombre">
    <button class="btn pri" data-a="enter" style="width:100%">Entrar</button></div></div>`;
}

/* =====================  NAVEGACIÓN  ===================== */
const $app=document.getElementById('app');
function applyPrefs(){
  const r=document.documentElement;
  r.style.setProperty('--fs',SIZES[S.size]||SIZES[0]);
  if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);
}
function render(){
  applyPrefs();
  let h;
  if(S.out)h=loginScreen();
  else if(R.s==='levels'&&story(R.sid)&&story(R.sid).open)h=levelsScreen(R.sid);
  else if(R.s==='read'&&story(R.sid)&&story(R.sid).levels[R.l])h=readScreen(R);
  else if(R.s==='quiz'&&Q)h=quizScreen();
  else if(R.s==='ranking')h=rankScreen();
  else if(R.s==='settings')h=settingsScreen();
  else if(R.s==='credits')h=creditsScreen();
  else{R={s:'home'};h=homeScreen()}
  $app.innerHTML=h;
}
function parseTo(t){const a=t.split(':');return {s:a[0],sid:a[1],l:+a[2],p:+a[3]}}
function go(r){
  if(typeof r==='string')r=parseTo(r);
  if((r.s==='read'||r.s==='quiz')&&!unlocked(r.sid,r.l))return;
  if(r.s==='quiz'){
    if(partsRead(r.sid,r.l)<PARTS){toast('Primero lee las 3 partes del nivel 📖');return}
    Q={sid:r.sid,l:r.l,i:0,score:0,pick:null,end:false};
  }
  R=r;
  try{window.speechSynthesis.cancel()}catch(e){}
  try{history.pushState(r,'')}catch(e){}
  render();window.scrollTo(0,0);
}
window.addEventListener('popstate',e=>{
  R=e.state||{s:'home'};
  if(R.s==='quiz')R={s:'levels',sid:R.sid};
  render();
});

/* Avisos y diálogos */
let tT;
function toast(t){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=t;el.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('show'),2000);
}
function ask(msg,label,fn){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><p>${msg}</p><div class="mrow"><button class="btn ghost" data-m="no">Cancelar</button><button class="btn pri" data-m="yes">${label}</button></div></div>`;
  m.addEventListener('click',e=>{const b=e.target.closest('[data-m]');
    if(e.target===m||(b&&b.dataset.m==='no'))m.remove();else if(b){m.remove();fn()}});
  document.body.appendChild(m);m.querySelector('[data-m="yes"]').focus();
}

/* Lógica de juego */
function markRead(sid,l,p){
  const k=kp(sid,l,p);
  if(!S.parts[k]){S.parts[k]=true;S.points+=50;save();toast('+50 puntos ⭐')}
}
function finishQuiz(){
  const L=story(Q.sid).levels[Q.l],n=L.quiz.length,k=kd(Q.sid,Q.l);
  const prev=S.quiz[k]||0,delta=Math.max(0,Q.score-prev)*100;
  const pass=Q.score>=Math.ceil(n/2),bonus=pass&&!S.done[k]?150:0;
  S.quiz[k]=Math.max(prev,Q.score);
  if(pass)S.done[k]=true;
  S.points+=delta+bonus;save();
  Q.end=true;Q.res={delta,bonus,pass};
}
function enter(){
  const v=(document.getElementById('lname')||{}).value||'';
  S.name=v.trim()||'Lector';S.out=false;save();R={s:'home'};render();window.scrollTo(0,0);
}
function speakText(){
  if(!canSpeak)return;
  try{
    const ss=window.speechSynthesis;
    if(ss.speaking){ss.cancel();return}
    const u=new SpeechSynthesisUtterance(plain(story(R.sid).levels[R.l].parts[R.p].x));
    u.lang='es-AR';u.rate=.9;ss.speak(u);
  }catch(e){}
}

/* Eventos */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,d=t.dataset;
  switch(a){
    case 'nav':go(d.to);break;
    case 'cont':{
      const sid=d.s,l=+d.l;let p=-1;
      for(let j=0;j<PARTS;j++){if(!S.parts[kp(sid,l,j)]){p=j;break}}
      go(p<0?{s:'quiz',sid,l}:{s:'read',sid,l,p});break;}
    case 'next':{
      markRead(R.sid,R.l,R.p);
      go(R.p<PARTS-1?{s:'read',sid:R.sid,l:R.l,p:R.p+1}:{s:'quiz',sid:R.sid,l:R.l});break;}
    case 'def':{
      const b=document.getElementById('def');if(!b)break;
      b.hidden=false;b.innerHTML='<b>'+ESC(d.w)+':</b> '+ESC(d.d);break;}
    case 'speak':speakText();break;
    case 'pick':{
      if(Q.pick!=null)break;
      const q=story(Q.sid).levels[Q.l].quiz[Q.i];
      Q.pick=+d.i;if(Q.pick===q.a)Q.score++;render();break;}
    case 'qnext':{
      const n=story(Q.sid).levels[Q.l].quiz.length;
      if(Q.i+1<n){Q.i++;Q.pick=null}else finishQuiz();
      render();window.scrollTo(0,0);break;}
    case 'size':S.size=+d.i;save();render();break;
    case 'voice':S.voice=!S.voice;save();render();break;
    case 'theme':S.theme=d.v;save();render();break;
    case 'reset':ask('¿Seguro que quieres borrar tus puntos y niveles?','Reiniciar',()=>{
      S.points=DEF.points;S.parts={};S.quiz={};S.done={};save();toast('Progreso reiniciado');render()});break;
    case 'logout':ask('¿Quieres cerrar sesión? Tu progreso se guarda en este dispositivo.','Salir',()=>{S.out=true;save();render();window.scrollTo(0,0)});break;
    case 'enter':enter();break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='setname'){S.name=e.target.value.trim()||'Lector';save()}
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if((e.key==='Enter'||e.key===' ')&&t.getAttribute&&t.getAttribute('role')==='button'){e.preventDefault();t.click()}
  if(e.key==='Enter'&&t.id==='lname')enter();
});

try{history.replaceState({s:'home'},'')}catch(e){}
render();
</script>
</body>
</html>
