<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./Style/Menu.css">
</head>
<body>
    <section class="login">


    <div class="login-card">


        <img src="./Imagenes/librin.png" class="librin-login">


        <h1>
            NeoLectura 📚
        </h1>


        <p>
            ¡Bienvenido de nuevo lector!
        </p>



        <label>
            Usuario
        </label>

        <input 
        type="text"
        placeholder="Ingresa tu usuario">



        <label>
            Contraseña
        </label>


        <input 
        type="password"
        placeholder="Ingresa tu contraseña">



        <label class="recordar">

            <input type="checkbox">

            Recordar sesión

        </label>



        <button class="btn-login">

            Ingresar

        </button>



        <p class="registro">

            ¿No tienes cuenta?

            <b>
                Crear cuenta
            </b>

        </p>



    </div>


</section>

</body>
</html>
